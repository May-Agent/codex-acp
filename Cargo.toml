[package]
name = "codex-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Serve OpenAI Codex as an Agent Client Protocol (ACP) agent by bridging the Codex app-server protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/May-Agent/codex-acp"
publish = false
keywords = ["acp", "agent", "protocol", "codex"]
categories = ["api-bindings"]

[features]
default = ["process"]
# `process` lets the bridge spawn the `codex` binary itself. Consumers that
# attach an already-connected app-server pair of streams can turn it off.
process = ["dep:async-process"]

[dependencies]
agent-client-protocol = { version = "5", features = ["stdio", "unstable"] }
codex-codes = { version = "0.166.5", default-features = false, features = ["types"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
futures-lite = "2"
futures-util = "0.3"
async-channel = "2"
async-lock = "3"
async-process = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
style = "warn"
correctness = "warn"
complexity = "warn"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }
struct_excessive_bools = { level = "allow", priority = 1 }
trivially_copy_pass_by_ref = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
